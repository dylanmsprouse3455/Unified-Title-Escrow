name: Refresh remembered caller options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-call-contact-options.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refresh patch
        run: python scripts/refresh_call_contact_options.py
      - name: Verify JavaScript
        run: |
          node --check tracker/call-tracker.js
          grep -F 'refreshCallerOptions();' tracker/call-tracker.js
          grep -F 'contacts-layout-20260827-2' tracker/index.html
      - name: Commit refresh patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/call-tracker.js tracker/index.html
          git commit -m "Refresh remembered caller options after load"
          git push
