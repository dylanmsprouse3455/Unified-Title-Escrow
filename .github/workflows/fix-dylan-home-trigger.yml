name: Fix Dylan home trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dylan-home-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persistent Dylan home trigger
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('tracker/case-import.js')
          js = js_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = '  setInterval(checkSession,1000);'
          if marker not in js:
              ending = '})();\n})();'
              pos = js.rfind(ending)
              if pos == -1:
                  raise SystemExit('Could not locate Dylan home script ending')
              js = js[:pos] + marker + '\n' + js[pos:]
              js_path.write_text(js, encoding='utf-8')

          html_path = Path('tracker/index.html')
          html = html_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '<script src="case-import.js"></script>'
          new = '<script src="case-import.js?v=dylan-home-20260827-2"></script>'
          if old in html:
              html = html.replace(old, new, 1)
              html_path.write_text(html, encoding='utf-8')
      - name: Commit applied fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/case-import.js tracker/index.html
          git commit -m "Make Dylan personal home load reliably"
          git push
