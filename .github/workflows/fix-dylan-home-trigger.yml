name: Build call-entry wizard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dylan-home-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply wizard conversion
        run: python tools/apply-call-wizard.py

      - name: Check JavaScript syntax
        run: node --check tracker/call-tracker.js

      - name: Commit wizard update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/call-tracker.js tracker/index.html
          git commit -m "Convert call entry to guided wizard"
          git push
