name: Fix Dylan home trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dylan-home-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Dylan call tracker
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('tracker/index.html')
          html = html_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          if '<script src="call-tracker.js' not in html:
              anchor = '<script src="case-popout.js"></script>'
              if anchor not in html:
                  raise SystemExit('Could not find script anchor')
              html = html.replace(anchor, '<script src="case-popout.js"></script>\n<script src="call-tracker.js?v=20260827-1"></script>', 1)
          else:
              import re
              html = re.sub(r'<script src="call-tracker\.js[^\"]*"></script>', '<script src="call-tracker.js?v=20260827-1"></script>', html, count=1)
          html_path.write_text(html, encoding='utf-8')
      - name: Commit toolbox integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/index.html
          git commit -m "Load Call and Follow-Up Tracker in Dylan toolbox"
          git push
