name: Enhance call tracker contacts and layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-call-contacts-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply enhancement
        run: python scripts/enhance_call_tracker_contacts_layout.py

      - name: Verify JavaScript and integration
        run: |
          node --check tracker/call-tracker.js
          grep -F 'installCallerMemory()' tracker/call-tracker.js
          grep -F 'rememberContact(record)' tracker/call-tracker.js
          grep -F 'call-tracker-layout.css?v=call-board-20260827-1' tracker/index.html
          grep -F 'contacts-layout-20260827-1' tracker/index.html

      - name: Commit enhancements
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/call-tracker.js tracker/call-tracker-layout.css tracker/index.html
          git commit -m "Remember callers and use spacious call cards"
          git push
