name: Repair Opening Checklist

on:
  push:
    paths:
      - '.github/workflows/fix-opening-checklist.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild plain HTML from staged payload
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path

          parts = sorted(Path('.opening-parts').glob('part*.txt'))
          assert len(parts) == 7, f'Expected 7 payload parts, found {len(parts)}'
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(payload) == 20900, f'Unexpected payload length: {len(payload)}'
          assert len(payload) % 4 == 0
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          assert 'Opening Order Case Tracker' in html
          assert 'Create My First Case' in html
          assert '.flag-controls{' in html
          Path('opening-checklist.html').write_text(html, encoding='utf-8')
          print(f'Rebuilt opening-checklist.html with {len(html)} characters')
      - name: Commit repaired page and remove staging parts
        run: |
          rm -rf .opening-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening-checklist.html .opening-parts
          git commit -m "Fix blank opening checklist page"
          git push
