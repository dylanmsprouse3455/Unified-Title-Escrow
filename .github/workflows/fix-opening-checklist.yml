name: Validate Opening Checklist

on:
  push:
    paths:
      - '.github/workflows/fix-opening-checklist.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compressed checklist payload
        shell: python
        run: |
          import base64, gzip, re
          from pathlib import Path

          source = Path('opening-checklist.html').read_text(encoding='utf-8')
          m = re.search(r"const b64='([^']+)'", source)
          assert m, 'Compressed payload was not found.'
          payload = m.group(1)
          assert len(payload) % 4 == 0, f'Invalid base64 length: {len(payload)}'
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          assert 'Opening Order Case Tracker' in html, 'Expected app title not found.'
          assert 'Create My First Case' in html, 'Expected case-creation UI not found.'
          assert '.flag-controls{' in html, 'Flag-controls CSS rule is missing.'
          print(f'Validated payload: {len(payload)} base64 chars -> {len(html)} HTML chars')
