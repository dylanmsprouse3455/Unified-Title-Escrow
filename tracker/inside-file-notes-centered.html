<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Inside File Working Notes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#ececec;color:#111;font-family:Arial,Helvetica,sans-serif}
.toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:12px;padding:14px;background:#fff;border-bottom:1px solid #ccc}
.toolbar button{border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;font-size:16px;padding:11px 22px;cursor:pointer}
.toolbar span{align-self:center;font-size:13px;font-weight:700}
.sheet{width:8in;min-height:10.5in;margin:18px auto;background:#fff;border:1px solid #111;padding:.2in;box-shadow:0 4px 20px #0002}
.header{text-align:center;font-size:15px;font-weight:800;letter-spacing:.4px;margin:0 0 10px}
.section{border:1.3px solid #111;margin-top:9px}
.section-title{text-align:center;font-size:12px;font-weight:800;letter-spacing:.25px;padding:5px 8px;border-bottom:1.3px solid #111;background:#f7f7f7}
.lines{padding:0 12px 10px}.write-line{height:34px;border-bottom:1px solid #555}
.checklist{padding:4px 12px 9px}.check-row{height:38px;border-bottom:1px solid #555;display:flex;align-items:center;gap:10px}.check-row:last-child{border-bottom:0}.box{width:16px;height:16px;border:1.3px solid #111;flex:0 0 auto}
@media print{
  @page{size:Letter portrait;margin:0}
  html,body{
    width:8.5in!important;
    height:11in!important;
    margin:0!important;
    padding:0!important;
    background:#fff!important;
  }
  body{
    zoom:86.9565%;
    position:relative!important;
  }
  .toolbar{display:none!important}
  .sheet{
    width:8in!important;
    min-height:0!important;
    height:auto!important;
    margin:.22in auto 0 auto!important;
    padding:.14in!important;
    border:1px solid #000!important;
    box-shadow:none!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
  }
  .header{font-size:13px;margin-bottom:6px}
  .section{margin-top:6px}
  .section-title{font-size:10px;padding:4px 6px}
  .lines{padding:0 10px 6px}.write-line{height:27px}
  .checklist{padding:2px 10px 6px}.check-row{height:31px;gap:8px}.box{width:13px;height:13px}
}
@media(max-width:900px){.sheet{width:96%;min-height:auto;margin:12px auto}.toolbar{flex-direction:column;align-items:center}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">PRINT WORKING NOTES</button><span>Print setting: keep Scale at 115%</span></div>
<main class="sheet">
  <div class="header">INSIDE FILE WORKING NOTES</div>
  <section class="section"><div class="section-title">GENERAL FILE NOTES</div><div class="lines"><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div></div></section>
  <section class="section"><div class="section-title">TO DO LIST</div><div class="checklist"><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div></div></section>
  <section class="section"><div class="section-title">WAITING ON / ACTION ITEMS</div><div class="checklist"><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div><div class="check-row"><span class="box"></span></div></div></section>
  <section class="section"><div class="section-title">IMPORTANT / DO NOT MISS</div><div class="lines"><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div></div></section>
</main>
</body>
</html>
