<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unified Title & Escrow Training Wizard</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#172536}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.loading strong{color:#092947;font-size:20px}
</style>
</head>
<body>
<div class="loading" id="loading"><div><strong>Loading Training Wizard…</strong><br><span>Unified Title &amp; Escrow</span></div></div>
<script>
fetch('./training-wizard.html',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('Unable to load training wizard');return r.text()})
  .then(src=>{
    const inject=`<style>
      .lunchtime-launch{position:fixed;right:18px;top:18px;z-index:250;display:flex;align-items:center;gap:10px;padding:10px 15px;border:1px solid rgba(9,41,71,.16);border-radius:999px;background:linear-gradient(135deg,#fff6d7,#f2c45f);color:#092947;text-decoration:none;font-weight:900;box-shadow:0 10px 28px rgba(9,41,71,.18);transition:.16s ease}
      .lunchtime-launch:hover,.lunchtime-launch:focus-visible{transform:translateY(-2px);box-shadow:0 14px 34px rgba(9,41,71,.24)}
      .lunchtime-launch .lunch-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#092947;color:#fff;font-size:16px}
      .lunchtime-launch .lunch-copy{display:flex;flex-direction:column;line-height:1.05}
      .lunchtime-launch .lunch-copy b{font-size:.9rem}
      .lunchtime-launch .lunch-copy small{font-size:.61rem;letter-spacing:.05em;text-transform:uppercase;color:#6b5018;margin-top:3px}

      .interactive-tools-section{margin:34px 0 6px;padding:22px;border:1px solid #b9ccda;border-radius:18px;background:linear-gradient(135deg,#eef7fc,#f8fbfd)}
      .interactive-tools-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
      .interactive-tools-kicker{color:#1769a4;font-size:.69rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
      .interactive-tools-head h2{margin:3px 0 4px;color:#092947;font:700 1.65rem/1.15 Georgia,serif}
      .interactive-tools-head p{margin:0;color:#667487;font-size:.88rem;max-width:720px}
      .interactive-tools-grid{display:grid;grid-template-columns:1fr;gap:13px}
      .interactive-tool-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;border:1px solid #aac9dc;background:#fff;padding:22px;border-radius:16px;text-decoration:none;color:inherit;box-shadow:0 5px 18px rgba(18,50,76,.08);transition:.18s}
      .interactive-tool-card:hover,.interactive-tool-card:focus-visible{transform:translateY(-2px);border-color:#1769a4;box-shadow:0 14px 30px rgba(18,50,76,.14)}
      .interactive-tool-icon{display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:#092947;color:#fff;font-size:1.45rem;font-weight:900}
      .interactive-tool-copy h3{margin:0 0 5px;color:#092947;font:700 1.26rem/1.2 Georgia,serif}
      .interactive-tool-copy p{margin:0;color:#667487;font-size:.9rem;line-height:1.5}
      .interactive-tool-meta{display:flex;align-items:center;gap:10px;white-space:nowrap}
      .interactive-tool-pill{padding:7px 10px;border-radius:999px;background:#eaf5fc;color:#1769a4;font-size:.72rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
      .interactive-tool-arrow{color:#c99e4b;font-size:1.4rem;font-weight:900}

      .workflow-checklists-section{margin:18px 0 6px;padding:22px;border:1px solid #b8d9ee;border-radius:18px;background:#eaf7ff}
      .workflow-checklists-head{margin-bottom:16px}
      .workflow-checklists-kicker{color:#1769a4;font-size:.69rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
      .workflow-checklists-head h2{margin:3px 0 4px;color:#092947;font:700 1.55rem/1.15 Georgia,serif}
      .workflow-checklists-head p{margin:0;color:#5f7487;font-size:.86rem;max-width:760px}
      .workflow-checklists-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
      .workflow-checklist-card{position:relative;display:block;border:1px solid #a9cde3;background:#fff;padding:19px;border-radius:15px;min-height:154px;text-decoration:none;color:inherit;box-shadow:0 3px 12px rgba(26,87,126,.06);transition:.18s}
      .workflow-checklist-card.available:hover,.workflow-checklist-card.available:focus-visible{transform:translateY(-2px);border-color:#4a9aca;box-shadow:0 12px 25px rgba(26,87,126,.13)}
      .workflow-checklist-card .num{background:#dff2fd!important;color:#1769a4!important}
      .workflow-checklist-card h3{font:700 1.12rem Georgia,serif;color:#092947;margin:15px 0 5px}
      .workflow-checklist-card p{font-size:.83rem;color:#61778a;margin:0;line-height:1.5}
      .workflow-checklist-card .arrow{color:#1769a4!important}
      .workflow-checklist-card.coming-soon{cursor:default;background:rgba(255,255,255,.82);border-style:dashed}
      .coming-soon-caption{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:999px;background:#fff0ef;color:#b42318;border:1px solid #f1b6b0;font-size:.68rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
      @media(max-width:760px){
        .lunchtime-launch{top:10px;right:10px;padding:8px 11px}.lunchtime-launch .lunch-icon{width:27px;height:27px}.lunchtime-launch .lunch-copy small{display:none}
        .interactive-tools-section,.workflow-checklists-section{padding:17px}.interactive-tools-head{display:block}.interactive-tool-card{grid-template-columns:auto 1fr;align-items:start}.interactive-tool-meta{grid-column:1/-1;justify-content:space-between;padding-left:68px}.workflow-checklists-grid{grid-template-columns:1fr}
      }
      @media print{.lunchtime-launch{display:none!important}}
    </style>
    <a class="lunchtime-launch" href="lunchtime.html" aria-label="Open Lunchtime food guide"><span class="lunch-icon">☰</span><span class="lunch-copy"><b>Lunchtime</b><small>Greeneville food guide</small></span></a>
    <script>
      function insertInteractiveTools(){
        const grid=document.getElementById('grid');if(!grid||document.getElementById('interactiveToolsSection'))return;
        const section=document.createElement('section');section.id='interactiveToolsSection';section.className='interactive-tools-section';
        section.innerHTML='<div class="interactive-tools-head"><div><div class="interactive-tools-kicker">Interactive Tools</div><h2>Templates &amp; Work Tools</h2><p>Build ready-to-use work products, study closing documents, and open trusted references for settlement files.</p></div></div><div class="interactive-tools-grid"><a class="interactive-tool-card" href="closing-quote-builder.html"><div class="interactive-tool-icon">$</div><div class="interactive-tool-copy"><h3>Closing Quote Builder</h3><p>Build the correct fee quote and generate a ready-to-send email for purchases, refinances, in-house loans, reverse mortgages, cash deals, and FSBO transactions.</p></div><div class="interactive-tool-meta"><span class="interactive-tool-pill">Open Tool</span><span class="interactive-tool-arrow">→</span></div></a><a class="interactive-tool-card" href="interactive-document-review.html"><div class="interactive-tool-icon">↗</div><div class="interactive-tool-copy"><h3>Closing Disclosure + HUD-1</h3><p>Open the interactive form viewer and tap mapped sections for related Qualia paths and explanations.</p></div><div class="interactive-tool-meta"><span class="interactive-tool-pill">Open Tool</span><span class="interactive-tool-arrow">→</span></div></a><a class="interactive-tool-card" href="state-document-library.html"><div class="interactive-tool-icon">▤</div><div class="interactive-tool-copy"><h3>State Document Library</h3><p>Browse state-specific, government, county, and city document references.</p></div><div class="interactive-tool-meta"><span class="interactive-tool-pill">Open Library</span><span class="interactive-tool-arrow">→</span></div></a><a class="interactive-tool-card" href="qualia-master-reference.html"><div class="interactive-tool-icon">Q</div><div class="interactive-tool-copy"><h3>Qualia Master Reference</h3><p>Open the full searchable Qualia reference with workflows, filters, articles, and guided study tools.</p></div><div class="interactive-tool-meta"><span class="interactive-tool-pill">Open Reference</span><span class="interactive-tool-arrow">→</span></div></a></div>';
        grid.insertAdjacentElement('afterend',section)
      }
      function insertWorkflowChecklists(){
        const live=document.querySelector('.live-training-section');if(!live||document.getElementById('workflowChecklistsSection'))return;
        const section=document.createElement('section');section.id='workflowChecklistsSection';section.className='workflow-checklists-section';
        section.innerHTML='<div class="workflow-checklists-head"><div class="workflow-checklists-kicker">WORKFLOW CHECKLISTS</div><h2>Working Checklists</h2><p>Track a real file from start to finish and keep your place as you work.</p></div><div class="workflow-checklists-grid"><a class="workflow-checklist-card available" href="opening-checklist.html"><span class="arrow">→</span><div class="num">1</div><h3>Opening Checklist</h3><p>Create and track opening-order cases and see your next step.</p></a><div class="workflow-checklist-card coming-soon"><div class="num">2</div><h3>Closing Checklist</h3><p>A guided closing workflow will live here once it is built.</p><span class="coming-soon-caption">Coming Soon</span></div><a class="workflow-checklist-card available" href="post-closing-checklist.html"><span class="arrow">→</span><div class="num">3</div><h3>Post-Closing Checklist</h3><p>Process the closed package, decide what needs copying, build financials, recording, lender return, and internal file sections.</p></a></div>';
        live.insertAdjacentElement('afterend',section)
      }
      setTimeout(()=>{insertInteractiveTools();insertWorkflowChecklists()},0);
      const obs=new MutationObserver(()=>{insertInteractiveTools();insertWorkflowChecklists()});obs.observe(document.body,{childList:true,subtree:true});
    <\/script>`;
    src=src.replace('</head>','<link rel="stylesheet" href="./closing-fundamentals-fix.css"></head>');
    src=src.replace('</body>',inject+'</body>');
    document.open();document.write(src);document.close();
  })
  .catch(err=>{document.getElementById('loading').innerHTML='<div><strong>Unable to load the Training Wizard.</strong><br>Please refresh the page.</div>';console.error(err)});
</script>
</body>
</html>
