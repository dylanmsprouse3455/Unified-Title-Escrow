<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lunchtime | UTEI</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3efe8;color:#182235}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{color:#173f73;font-size:20px}.loading small{color:#687080}
</style>
</head>
<body>
<div class="loading"><div><strong>Loading Lunchtime…</strong><br><small>Greeneville office restaurant guide</small></div></div>
<script>
(async()=>{
  try{
    const paths=['part01.txt','part02.txt','part03.txt','part04.txt'];
    const parts=await Promise.all(paths.map(p=>fetch('./lunchtime-data/'+p+'?v=20260819-2110',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()})));
    const bin=atob(parts.join('').replace(/\s+/g,''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div><strong>Unable to load Lunchtime.</strong><br><small>Please refresh the page.</small></div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
