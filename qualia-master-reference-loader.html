<!doctype html><meta charset="utf-8"><title>Qualia Master Reference</title><style>body{font-family:Arial,sans-serif;background:#f4f7fa;color:#172536;margin:0;min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:34px;height:34px;border:4px solid #d9e5ed;border-top-color:#1769a4;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style><div class="box"><div class="spin"></div><strong>Loading Qualia Master Reference…</strong><div id="status" style="margin-top:8px;color:#667487;font-size:13px">Preparing 1,070-article reference</div></div><script>(async()=>{try{const names=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];let b='';for(let i=0;i<names.length;i++){document.getElementById('status').textContent=`Loading reference data ${i+1} of ${names.length}…`;const r=await fetch('./qualia-master-assets/'+names[i],{cache:'force-cache'});if(!r.ok)throw new Error('Missing '+names[i]);b+=await r.text()}const raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.querySelector('.box').innerHTML='<strong>Unable to load the Qualia Master Reference.</strong><div style="margin-top:8px">Refresh the page or try again in a moment.</div>'}})();</script>
